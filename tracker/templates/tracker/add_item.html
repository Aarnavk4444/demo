{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitchenSync Pro | Ingest New Inventory Asset (NPR)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-surface: #0b1329;
            --surface-glass: rgba(11, 19, 41, 0.8);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.4);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --text-secondary: #94a3b8;
            --radius-xl: 24px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .form-container {
            width: 100%;
            max-width: 540px;
        }

        .card-panel {
            background: var(--surface-glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 40px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .card-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.9), transparent);
        }

        .form-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .form-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 16px auto;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .form-header h2 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background: rgba(5, 8, 17, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            color: #fff;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        /* Styling select dropdown options nicely */
        select.input-field option {
            background-color: #0b1329;
            color: #fff;
            padding: 10px;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            background: rgba(5, 8, 17, 0.9);
        }

        /* Force calendar picker icon to pure white */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(2);
            cursor: pointer;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        .form-actions {
            display: flex;
            gap: 14px;
            margin-top: 32px;
        }

        .btn-submit {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
        }

        .btn-cancel {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="card-panel">
            <div class="form-header">
                <div class="form-icon">📦</div>
                <h2>Register Inventory Asset</h2>
                <p>Input telemetry parameters for NPR valuation and real-time tracking.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                
                <div class="input-group">
                    <label for="name">Asset Designation (Name)</label>
                    <input type="text" id="name" name="name" class="input-field" placeholder="e.g. Organic Basmati Rice" required>
                </div>

                <div class="input-group">
                    <label for="category">Classification (Category)</label>
                    <select id="category" name="category" class="input-field" required>
                        <option value="" disabled selected>Select Pantry Classification</option>
                        <option value="Dairy & Alternatives">🥛 Dairy & Alternatives</option>
                        <option value="Grains & Pulses">🌾 Grains & Pulses</option>
                        <option value="Produce">🥦 Produce & Vegetables</option>
                        <option value="Proteins & Meats">🥩 Proteins & Meats</option>
                        <option value="Beverages">🧃 Beverages</option>
                        <option value="Pantry Staples & Spices">🧂 Pantry Staples & Spices</option>
                        <option value="Bakery & Snacks">🥖 Bakery & Snacks</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="price">Valuation Capital (NPR - रु)</label>
                    <input type="number" step="0.01" id="price" name="price" class="input-field" placeholder="0.00" required>
                </div>

                <div class="input-group">
                    <label for="expiry_date">Expiration Timeline</label>
                    <input type="date" id="expiry_date" name="expiry_date" class="input-field" required>
                </div>

                <div class="form-actions">
                    <a href="{% url 'home' %}" class="btn-cancel">Cancel</a>
                    <button type="submit" class="btn-submit">Ingest Asset</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
