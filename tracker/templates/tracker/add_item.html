<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Item — FreshTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; }

        .form-container {
            background: var(--card-bg);
            padding: 35px;
            width: 100%;
            max-width: 440px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        h2 { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
        p.subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 8px; }
        
        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f8fafc;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            background: #ffffff;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Add Grocery Item</h2>
        <p class="subtitle">Log a new food item to keep track of its freshness.</p>

        <form method="POST">
            {% csrf_token %}
            
            <div class="input-group">
                <label for="name">Item Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g., Organic Milk">
            </div>

            <div class="input-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" required placeholder="e.g., Dairy, Vegetables, Snacks">
            </div>

            <div class="input-group">
                <label for="expiry_date">Expiry Date</label>
                <input type="date" id="expiry_date" name="expiry_date" required>
            </div>

            <button type="submit" class="btn-submit">Save Item to Inventory</button>
        </form>

        <a href="{% url 'home' %}" class="back-link">&larr; Back to Dashboard</a>
    </div>

</body>
</html>
